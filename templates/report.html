<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Report</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="wrap"><h1>Daily Attendance Report</h1><section><form method="get"><label>Date<input type="date" name="date" value="{{day}}"></label><button>Show report</button><a href="{{url_for('index')}}">Back</a></form></section><section><b>Present: {{present}}</b> &nbsp; <b>Absent: {{absent}}</b> &nbsp; <b>Total: {{present+absent}}</b></section><section><h2>Records for {{day}}</h2>{% if records %}<table><tr><th>Name</th><th>ID</th><th>Status</th></tr>{% for r in records %}<tr><td>{{r.student_name}}</td><td>{{r.student_id}}</td><td>{{r.status}}</td></tr>{% endfor %}</table>{% else %}<p>No records for this date.</p>{% endif %}</section></main></body></html>
